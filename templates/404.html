{% extends 'base.html' %}

{% block title %}404 - Page Not Found | DevStore{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex flex-col items-center justify-center text-center py-12 px-4">
    <!-- Big 404 Visual -->
    <div class="relative">
        <h1 class="text-8xl sm:text-9xl font-black text-primary/15 select-none">404</h1>
        <div class="absolute inset-0 flex items-center justify-center">
            <span class="text-2xl sm:text-3xl font-extrabold text-base-content">Page Not Found</span>
        </div>
    </div>

    <!-- Description -->
    <p class="mt-2 text-sm text-base-content/70 max-w-md leading-relaxed">
        The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
    </p>

    <!-- Navigation Buttons -->
    <div class="mt-8 flex flex-wrap justify-center gap-3">
        <a href="{% url 'products:home' %}" class="btn btn-primary rounded-xl px-6 shadow-md">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            Back to Home
        </a>
        <a href="{% url 'products:product_list' %}" class="btn btn-ghost border border-base-300 rounded-xl px-6">
            Browse Products
        </a>
    </div>
</div>
{% endblock %}
