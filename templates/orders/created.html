{% extends 'base.html' %}

{% block title %}Order Confirmed - DevStore{% endblock %}

{% block content %}

<div class="max-w-md mx-auto">

    <!-- Confirmation Card -->
    <div class="card bg-base-100 border border-base-300 p-8 text-center shadow-xl">

        <!-- Success Icon -->
        <div class="w-16 h-16 bg-success/10 text-success rounded-full flex items-center justify-center mx-auto mb-4">

            <svg
                class="w-8 h-8"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M5 13l4 4L19 7"
                />
            </svg>

        </div>


        <!-- Thank You -->
        <h1 class="text-2xl font-extrabold">
            Thank You!
        </h1>

        <p class="text-xs text-base-content/70 mt-2">
            Your order has been placed successfully.
        </p>


        <!-- Order Reference -->
        <div class="bg-base-200 p-3 rounded-xl my-6">

            <span class="text-xs text-base-content/60 block">
                Order Reference
            </span>

            <span class="font-mono font-bold text-sm">
                #{{ order.id }}
            </span>

        </div>


        <!-- Buttons -->
        <div class="w-full space-y-3">

            <!-- Continue Shopping -->
            <a
                href="{% url 'products:product_list' %}"
                class="btn btn-primary w-full btn-sm"
            >
                Continue Shopping
            </a>


            <!-- My Orders -->
            <a
                href="{% url 'orders:order_list' %}"
                class="btn btn-outline w-full btn-sm"
            >
                My Orders
            </a>

        </div>

    </div>

</div>

{% endblock %}
