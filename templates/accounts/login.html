{% extends 'base.html' %}

{% block title %}Sign In - DevStore{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto card bg-base-100 border border-base-300 p-8 shadow-xl">
    <h1 class="text-2xl font-extrabold text-center mb-6">Welcome Back</h1>
    
    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div class="form-control">
            <label class="label text-xs font-bold">Username</label>
            <input type="text" name="username" required class="input input-bordered input-sm w-full" />
        </div>
        <div class="form-control">
            <label class="label text-xs font-bold">Password</label>
            <input type="password" name="password" required class="input input-bordered input-sm w-full" />
        </div>

        <button type="submit" class="btn btn-primary btn-block mt-4">Sign In</button>
    </form>

    <p class="text-xs text-center mt-6 text-base-content/60">
        Don't have an account? <a href="{% url 'accounts:register' %}" class="text-primary font-bold">Sign Up</a>
    </p>
</div>
{% endblock %}
