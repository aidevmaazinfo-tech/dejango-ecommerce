{% extends 'base.html' %}

{% block title %}Sign Up - DevStore{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto card bg-base-100 border border-base-300 p-8 shadow-xl">
    <h1 class="text-2xl font-extrabold text-center mb-6">Create Account</h1>
    
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-control">
                <label class="label text-xs font-bold">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <span class="text-error text-[10px] mt-1">{{ field.errors.0 }}</span>
                {% endif %}
            </div>
        {% endfor %}

        <button type="submit" class="btn btn-primary btn-block mt-4">Create Account</button>
    </form>

    <p class="text-xs text-center mt-6 text-base-content/60">
        Already have an account? <a href="{% url 'accounts:login' %}" class="text-primary font-bold">Sign In</a>
    </p>
</div>
{% endblock %}
