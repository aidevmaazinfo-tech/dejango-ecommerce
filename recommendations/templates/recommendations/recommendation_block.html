<!-- =========================================================
     LIVE AUTO-REFRESHING RECOMMENDATIONS SECTION
========================================================== -->

<section class="mb-12">

    <div class="flex justify-between items-center mb-6">
        <div>
            <h2 class="text-2xl font-bold flex items-center gap-2">
                Recommended For You
                <!-- Live Pulse Indicator -->
                <span class="relative flex h-2.5 w-2.5">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-success opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-success"></span>
                </span>
            </h2>
            <p class="text-xs text-base-content/60 mt-1">
                Updated in real-time based on your activity
            </p>
        </div>
    </div>

    <!-- Container: Renders server partials first, then updates live from API -->
    <div id="recommendations-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
        {% if recommended_products %}
            {% for product in recommended_products %}
                {% include 'includes/components/_product_card.html' with product=product %}
            {% endfor %}
        {% else %}
            <div class="col-span-full text-center py-8 text-base-content/60">
                <span class="loading loading-spinner loading-md"></span>
                <p class="text-sm mt-2">Analyzing preferences...</p>
            </div>
        {% endif %}
    </div>

</section>

<!-- Auto-Polling API Script (Runs every 10 Seconds) -->
<script>
document.addEventListener("DOMContentLoaded", function () {
    const container = document.getElementById("recommendations-container");
    const apiUrl = "{% url 'recommendations:recommendations_api' %}";
    let previousIds = [];

    function fetchLiveRecommendations() {
        fetch(apiUrl, {
            method: "GET",
            headers: {
                "X-Requested-With": "XMLHttpRequest",
                "Content-Type": "application/json"
            }
        })
        .then(response => response.ok ? response.json() : Promise.reject(response))
        .then(data => {
            if (!data.recommendations || data.recommendations.length === 0) {
                if (!container.children.length || container.querySelector('.loading-spinner')) {
                    container.innerHTML = `
                        <div class="col-span-full text-center py-6 text-base-content/60">
                            <p class="text-sm">No recommendations available right now.</p>
                        </div>`;
                }
                return;
            }

            // Check if product list has changed before rewriting DOM
            const newIds = data.recommendations.map(p => p.id).join(',');
            if (newIds === previousIds) {
                return; // No updates needed
            }
            previousIds = newIds;

            // Render updated card list matching DaisyUI / Tailwind design
            container.innerHTML = data.recommendations.map(product => `
                <div class="card bg-base-100 border border-base-300 hover:border-primary p-4 rounded-2xl transition-all shadow-sm hover:shadow-md flex flex-col justify-between">
                    <a href="${product.url}" class="block">
                        ${product.image_url 
                            ? `<img src="${product.image_url}" alt="${product.name}" class="w-full h-48 object-cover rounded-xl mb-4" />`
                            : `<div class="w-full h-48 bg-base-200 rounded-xl mb-4 flex items-center justify-center text-base-content/40 text-xs">No Image</div>`}
                        <span class="text-xs font-semibold uppercase tracking-wider text-primary">
                            ${product.category || 'General'}
                        </span>
                        <h3 class="font-bold text-base text-base-content mt-1 line-clamp-1">
                            ${product.name}
                        </h3>
                    </a>
                    <div class="flex items-center justify-between mt-4 pt-3 border-t border-base-200">
                        <span class="font-black text-lg text-base-content">
                            $${product.price}
                        </span>
                        <a href="${product.url}" class="btn btn-primary btn-sm rounded-lg px-4">
                            View Product
                        </a>
                    </div>
                </div>
            `).join('');
        })
        .catch(err => console.error("Live update error:", err));
    }

    // Poll every 10,000 ms (10 seconds)
    setInterval(fetchLiveRecommendations, 10000);
});
</script>
